<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual | Autoescuela Code By Rusu</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">🏁 Autoescuela <span>Code By Rusu</span></div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="teorico.html" style="color: #ffcc00;">Teórico Online</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Aula Virtual</h1>
            <p>Accede a tus test ilimitados y clases grabadas. Objetivo: 0 fallos en el examen.</p>
        </section>

        <section class="form-container" style="max-width: 400px;">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="dni">DNI / NIE</label>
                    <input type="text" id="dni" placeholder="Tu documento" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-submit">Entrar al Aula</button>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
