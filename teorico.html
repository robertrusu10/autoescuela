<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Aula Virtual | Autoescuela Code By Rusu</title>
    <link rel="stylesheet" href="css/styles.css">
   
</head>
<body>
    <header style="padding: 20px 0; border-bottom: 1px solid #2a2a2a;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
        <!-- Logo Centrado -->
        <h1 class="logo" style="margin: 0; text-align: center;">
            <a href="index.html" style="color: white; text-decoration: none;">
                🏁 Autoescuela <span style="color: #ffcc00;">Code By Rusu</span>
            </a>
        </h1>

        <!-- Enlaces Centrados y Separados -->
        <nav>
            <ul style="display: flex; justify-content: center; gap: 40px; list-style: none; margin: 0; padding: 0;">
                <li><a href="index.html" style="color: white; text-decoration: none; font-weight: 500;">Inicio</a></li>
                <li><a href="teorico.html" style="color: white; text-decoration: none; font-weight: 500;">Teórico Online</a></li>
                <li><a href="contacto.html" style="color: white; text-decoration: none; font-weight: 500;">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <section class="page-header">
            <h1>Aula Virtual</h1>
            <p>Accede a tus test ilimitados y clases grabadas. Objetivo: 0 fallos en el examen.</p>
        </section>

        <section class="form-container" style="max-width: 400px;">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="dni">DNI / NIE</label>
                    <input type="text" id="dni" placeholder="Tu documento" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-submit">Entrar al Aula</button>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
