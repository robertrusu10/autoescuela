<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Autoescuela Rusu</title>
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>
   <header style="padding: 20px 0; border-bottom: 1px solid #2a2a2a;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
        <!-- Logo Centrado -->
        <h1 class="logo" style="margin: 0; text-align: center;">
            <a href="index.html" style="color: white; text-decoration: none;">
                🏁 Autoescuela <span style="color: #ffcc00;">Code By Rusu</span>
            </a>
        </h1>

        <!-- Enlaces Centrados y Separados -->
        <nav>
            <ul style="display: flex; justify-content: center; gap: 40px; list-style: none; margin: 0; padding: 0;">
                <li><a href="index.html" style="color: white; text-decoration: none; font-weight: 500;">Inicio</a></li>
                <li><a href="teorico.html" style="color: white; text-decoration: none; font-weight: 500;">Teórico Online</a></li>
                <li><a href="contacto.html" style="color: white; text-decoration: none; font-weight: 500;">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <section class="page-header">
            <h1>Arranca tu aventura</h1>
            <p>Pásate por nuestra oficina en Colmenar Viejo o escríbenos para reservar tu plaza.</p>
        </section>

        <section class="form-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Carlos Pérez" required>
                </div>
                <div class="form-group">
                    <label for="permiso">¿Qué carnet buscas?</label>
                    <select id="permiso">
                        <option value="B">Carnet B (Coche)</option>
                        <option value="A2">Carnet A2 (Moto)</option>
                        <option value="A">Carnet A (Moto Grande)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mensaje">¿Alguna duda?</label>
                    <textarea id="mensaje" rows="4" placeholder="Escribe aquí tu consulta..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Solicitar Información</button>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
